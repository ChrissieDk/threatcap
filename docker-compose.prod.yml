# Production stack. Only Caddy publishes ports (80/443); everything else stays on the internal network.
# Secrets come from ./.env on the server (never committed); see .env.production.example.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: threatwatch
      POSTGRES_USER: threatwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatwatch -d threatwatch"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=threatwatch;Username=threatwatch;Password=${POSTGRES_PASSWORD}
      Auth__ApiKey: ${API_KEY:?set API_KEY}
      Auth__RegistrationOpen: ${REGISTRATION_OPEN:-false}
      Auth__InviteCode: ${INVITE_CODE:-}
      Database__MigrateOnStartup: "true"
      Cors__Origin: https://${DOMAIN:?set DOMAIN}
      Alerts__WebBaseUrl: https://${DOMAIN}
      Alerts__PushSubject: mailto:${CONTACT_EMAIL:?set CONTACT_EMAIL}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
    volumes:
      - dpkeys:/app/data-protection-keys
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  web:
    build: ./web
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_URL: http://api:5080
      API_KEY: ${API_KEY}
    networks: [internal]
    read_only: true
    tmpfs: [/tmp, /app/.next/cache]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  internal:

volumes:
  pgdata:
  dpkeys:
  caddy_data:
  caddy_config:
