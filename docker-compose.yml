services:
  postgres:
    image: postgres:17
    container_name: threatwatch-postgres
    environment:
      POSTGRES_DB: threatwatch
      POSTGRES_USER: threatwatch
      POSTGRES_PASSWORD: threatwatch
    ports:
      - "5432:5432"
    volumes:
      - threatwatch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatwatch -d threatwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mail catcher for development: SMTP on 1025, inbox UI at http://localhost:8025.
  # Nothing is delivered to the outside world.
  mailpit:
    image: axllent/mailpit:latest
    container_name: threatwatch-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  threatwatch-data:
